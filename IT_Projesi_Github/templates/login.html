<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | IT Envanter</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #4F46E5 0%, #3730A3 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
        }
        .login-header {
            background: #F8FAFC;
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid #E2E8F0;
        }
        .form-control {
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            border: 1px solid #E2E8F0;
            background-color: #F8FAFC;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #4F46E5;
            background-color: #fff;
        }
        .btn-login {
            background: #4F46E5;
            border: none;
            border-radius: 0.75rem;
            padding: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .btn-login:hover {
            background: #3730A3;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="login-card">
        <div class="login-header">
            <div class="bg-primary text-white rounded-circle d-inline-flex justify-content-center align-items-center mb-3 shadow" style="width: 60px; height: 60px; font-size: 24px;">
                <i class="fas fa-server"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">IT Envanter Sistemi</h4>
            <p class="text-muted small mb-0">Schmid Pekintaş Yönetim Paneli</p>
        </div>
        <div class="p-4 px-5">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-success text-center py-2 small fw-bold rounded-pill">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}
            
            <form action="/" method="GET">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">Kullanıcı Adı</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" class="form-control border-start-0" value="admin" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">Şifre</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0" value="123456" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-login btn-primary w-100 mb-3">Giriş Yap <i class="fas fa-arrow-right ms-2"></i></button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
